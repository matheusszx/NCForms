spring:
  application:
    name: ncforms
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ncforms}
    username: ${DB_USER:ncforms}
    password: ${DB_PASSWORD:ncforms}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    enabled: true

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    # At least 32 characters (HS256). Set JWT_SECRET in production.
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-0123456789}
    expiration: ${JWT_EXPIRATION:PT8H}
  registration-enabled: ${APP_REGISTRATION_ENABLED:true}
  # Only needed when the frontend runs on another origin (e.g. ng serve without the proxy).
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
