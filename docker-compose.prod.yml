# Production overlay: adds Caddy in front of the app for automatic HTTPS.
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  frontend:
    # Only Caddy is exposed to the internet; the frontend is reached through the internal network.
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in the .env file}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
