services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ncforms
      POSTGRES_USER: ncforms
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ncforms -d ncforms"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Porta exposta apenas localmente, útil para desenvolvimento e backups.
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ncforms
      DB_USER: ncforms
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-PT8H}
      APP_REGISTRATION_ENABLED: ${APP_REGISTRATION_ENABLED:-true}
      CORS_ALLOWED_ORIGINS: ""

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-80}:80"

volumes:
  pgdata:
